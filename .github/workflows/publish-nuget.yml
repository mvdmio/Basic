name: "publish nuget"

on:
   workflow_dispatch:
   push:
      branches:
      - main
      paths:
      - "src/mvdmio.Basic/**"

permissions:
   contents: write

jobs:
   Publish:
      runs-on: ubuntu-latest
      steps:
      -  uses: actions/checkout@v6

      # The library uses C# 14 extension members, which need the .NET 10 compiler.
      -  name: Setup .NET
         uses: actions/setup-dotnet@v5
         with:
            dotnet-version: "10.0.x"

      -  name: Restore
         run: dotnet restore test/mvdmio.Basic.Tests.Unit/mvdmio.Basic.Tests.Unit.csproj

      # The library is built on its own: the net10.0-only test build skips its net8.0 and net9.0 outputs, which the pack needs.
      -  name: Build
         run: |
            dotnet build src/mvdmio.Basic/mvdmio.Basic.csproj -c Release --no-restore
            dotnet build test/mvdmio.Basic.Tests.Unit/mvdmio.Basic.Tests.Unit.csproj -c Release --no-restore

      -  name: Test
         run: dotnet test test/mvdmio.Basic.Tests.Unit/mvdmio.Basic.Tests.Unit.csproj -c Release --no-build --verbosity normal

      -  name: Pack
         run: dotnet pack src/mvdmio.Basic/mvdmio.Basic.csproj -c Release --no-build -o artifacts

      -  name: Push
         run: dotnet nuget push "artifacts/mvdmio.Basic.*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate

      -  name: Create GitHub release
         env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/mvdmio.Basic/mvdmio.Basic.csproj)
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
               echo "Release $TAG already exists, skipping"
            else
               gh release create "$TAG" --title "$TAG" --generate-notes
            fi
